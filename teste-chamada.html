<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Chamada — Guardian Shield</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1 { font-size: 1.8rem; margin-bottom: 2rem; color: #22c55e; }

        .status {
            background: rgba(255,255,255,0.05);
            padding: 1rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .botoes-principais {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        button {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-ligar { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .btn-ligar:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(34,197,94,0.35); }
        .btn-desligar { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; display: none; }
        .btn-desligar:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(239,68,68,0.35); }

        /* Tela Chamada Entrante */
        .tela-chamada-entrante {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #22c55e;
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            box-shadow: 0 0 60px rgba(34,197,94,0.2);
        }

        .tela-chamada-entrante.ativo {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .tela-chamada-entrante h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
        .tela-chamada-entrante .nome { font-size: 1.8rem; font-weight: bold; margin-bottom: 1.5rem; color: #94a3b8; }
        .tela-chamada-entrante .acoes { display: flex; gap: 1rem; justify-content: center; }

        .btn-atender { background: #22c55e; color: white; }
        .btn-recusar { background: #ef4444; color: white; }

        /* Painel em Chamada */
        .painel-chamada {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.2rem;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .painel-chamada.ativo {
            opacity: 1;
            pointer-events: auto;
        }

        .painel-chamada .cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .painel-chamada .tempo { color: #94a3b8; font-size: 0.9rem; }
        .botoes-controles { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .botoes-controles button {
            padding: 0.6rem 0.9rem;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .botoes-controles button.ativo-btn { background: #22c55e; border-color: #22c55e; }

        .piscando { animation: piscar 1.2s infinite; }
        @keyframes piscar {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <h1>📞 Simulação de Chamada</h1>

    <div class="status" id="status">🟢 Pronto — Aguardando</div>

    <div class="botoes-principais">
        <button class="btn-ligar" id="btnIniciar">🔊 Fazer Chamada</button>
        <button class="btn-desligar" id="btnEncerrar">❌ Encerrar</button>
    </div>

    <!-- Tela Chamada Entrante -->
    <div class="tela-chamada-entrante" id="telaEntrante">
        <h2>🔔 Chamada Entrante</h2>
        <div class="nome">Ana Albuquerque</div>
        <div style="margin-bottom:1rem; color:#94a3b8" id="textoAguardando">Aguardando resposta...</div>
        <div class="acoes">
            <button class="btn-atender" id="btnAtender">📤 Atender</button>
            <button class="btn-recusar" id="btnRecusar">📥 Recusar</button>
        </div>
    </div>

    <!-- Painel Durante Chamada -->
    <div class="painel-chamada" id="painelChamada">
        <div class="cabecalho">
            <strong>Ana Albuquerque</strong>
            <span class="tempo" id="cronometro">00:00</span>
        </div>
        <div class="botoes-controles">
            <button id="btMicrofone">🎤 Mudo</button>
            <button id="btVolume">🔊 Volume</button>
            <button id="btWebcam">📷 Webcam</button>
            <button id="btTela">🖥️ Tela</button>
            <button id="btChat">💬 Chat</button>
        </div>
    </div>

    <script>
        const status = document.getElementById('status');
        const btnIniciar = document.getElementById('btnIniciar');
        const btnEncerrar = document.getElementById('btnEncerrar');
        const telaEntrante = document.getElementById('telaEntrante');
        const btnAtender = document.getElementById('btnAtender');
        const btnRecusar = document.getElementById('btnRecusar');
        const painelChamada = document.getElementById('painelChamada');
        const textoAguardando = document.getElementById('textoAguardando');
        const cronometro = document.getElementById('cronometro');

        let tempo;
        let segundos = 0;

        function formatarTempo(seg) {
            const m = Math.floor(seg / 60).toString().padStart(2,'0');
            const s = (seg % 60).toString().padStart(2,'0');
            return `${m}:${s}`;
        }

        // FAZER CHAMADA
        btnIniciar.addEventListener('click', () => {
            status.innerHTML = "📞 Chamando... <span class='piscando'>tocando...</span>";
            btnIniciar.disabled = true;
            // Simula chamando depois aparece chamada entrante
            setTimeout(() => {
                status.innerHTML = "⏳ Aguardando atendimento...";
                telaEntrante.classList.add('ativo');
                textoAguardando.innerHTML = "Tocando do outro lado...";
            }, 1500);
        });

        // ATENDER
        btnAtender.addEventListener('click', () => {
            telaEntrante.classList.remove('ativo');
            status.innerHTML = "🟢 Em chamada — Ana Albuquerque";
            btnIniciar.style.display = 'none';
            btnEncerrar.style.display = 'inline-block';
            painelChamada.classList.add('ativo');
            segundos = 0;
            cronometro.textContent = formatarTempo(0);
            tempo = setInterval(() => {
                segundos++;
                cronometro.textContent = formatarTempo(segundos);
            }, 1000);
        });

        // RECUSAR
        btnRecusar.addEventListener('click', () => {
            telaEntrante.classList.remove('ativo');
            status.innerHTML = "🔴 Chamada recusada";
            btnIniciar.disabled = false;
            setTimeout(() => status.innerHTML = "🟢 Pronto — Aguardando", 2500);
        });

        // ENCERRAR
        btnEncerrar.addEventListener('click', () => {
            clearInterval(tempo);
            painelChamada.classList.remove('ativo');
            btnEncerrar.style.display = 'none';
            btnIniciar.style.display = 'inline-block';
            btnIniciar.disabled = false;
            status.innerHTML = `🔴 Chamada encerrada — Duração: ${formatarTempo(segundos)}`;
            setTimeout(() => status.innerHTML = "🟢 Pronto — Aguardando", 3000);
        });

        // Botões controle
        document.querySelectorAll('.botoes-controles button').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('ativo-btn');
            });
        });
    </script>
    
</body>
</html>
